<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1d23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TraineeXP">
<title>TraineeXP Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay">
  <div class="load-logo">⚡ TraineeXP</div>
  <div class="spinner"></div>
  <div class="load-msg" id="loadMsg">Connecting to server...</div>
</div>

<!-- LOGIN -->
<div class="screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">⚡ TraineeXP</div>
    <div class="login-title">Welcome Back</div>
    <div class="login-sub">Trainee Management System</div>
    <div class="form-group"><label>Username</label><input type="text" id="loginUser" placeholder="Enter name or username" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="form-group" style="margin-bottom:16px;">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="loginPass" placeholder="Password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" class="pw-toggle" onclick="togglePwVisibility()" title="Show/hide password" id="pwToggleBtn" aria-label="Show/hide password">
          <i data-lucide="eye" id="pwToggleIcon"></i>
        </button>
      </div>
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In →</button>
    <div class="error-msg" id="loginError">Invalid credentials. Please try again.</div>
  </div>
</div>

<!-- MAIN APP -->
<div class="screen" id="mainScreen">
  <!-- Sidebar overlay for mobile tap-to-close -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="hamburger" id="hamburgerBtn" onclick="toggleMobileSidebar()" aria-label="Menu">
        <i data-lucide="menu"></i>
      </button>
      <div class="topbar-logo" onclick="if(currentUser)navigateTo(currentRole==='admin'?'adminDashboard':'internDashboard')" style="cursor:pointer;" title="Go to Dashboard">⚡ TraineeXP</div>
    </div>
    <div class="topbar-right">
      <span class="sync-status" id="syncStatus"></span>
      <button class="notif-bell" onclick="handleNotifClick()" aria-label="Notifications">
        <i data-lucide="bell"></i><span class="notif-dot" id="notifDot"></span>
      </button>
      <div class="user-chip" onclick="openProfilePopup()" style="cursor:pointer;" title="View Profile">
        <div class="user-avatar" id="topAvatar"></div>
        <div><div class="user-name" id="topName">-</div><div class="user-role" id="topRole">-</div></div>
      </div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleDarkMode()" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i data-lucide="moon"></i>
      </button>
      <button class="logout-btn" onclick="doLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </div>
  <div class="main-content">
    <div class="sidebar" id="sidebar"></div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
<div class="toast" id="toast"><span id="toastIcon">✓</span><span id="toastMsg">Done!</span></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalBody"></div></div>
</div>

<script src="script.js"></script>
</body>
</html>
