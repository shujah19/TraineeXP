<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraineeXP Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Loading Overlay -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="load-logo">TraineeXP</div>
  <div class="load-msg">Connecting to server...</div>
</div>

<!-- Login Screen -->
<div id="loginScreen" class="screen">
  <div class="login-box">
    <div class="login-logo">TraineeXP</div>
    <div class="login-title">Welcome Back</div>
    <div class="login-sub">Enter your credentials to access the portal</div>
    <form onsubmit="doLogin(); return false;">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>
    <div id="loginError" class="error-msg">Invalid username or password</div>
  </div>
</div>

<!-- Main Screen -->
<div id="mainScreen" class="screen">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-logo">TraineeXP</div>
    <div class="topbar-right">
      <div id="syncStatus" class="sync-status"></div>
      <button class="hamburger" onclick="toggleMobileSidebar()">☰</button>
      <button id="syncBtn" class="sync-btn" onclick="manualSync()" title="Sync with server">
        <span class="s-icon">🔄</span> <span>Sync</span>
      </button>
      <button id="notifDot" class="notif-bell" onclick="handleNotifClick()" title="Notifications">
        <span>🔔</span>
        <span class="notif-dot"></span>
      </button>
      <div class="user-chip">
        <div class="user-avatar" id="topAvatar"></div>
        <div>
          <div class="user-name" id="topName"></div>
          <div class="user-role" id="topRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Logout">🚪</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
      <!-- Rendered by JS -->
    </div>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <!-- Content Area -->
    <div id="contentArea" class="content-area">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <div id="mobileNav" class="mobile-nav">
    <div id="mobileNavInner" class="mobile-nav-inner">
      <!-- Rendered by JS -->
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <div id="modalBody" class="modal-body">
      <!-- Modal content rendered by JS -->
    </div>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Success!</span>
</div>

<script src="script.js"></script>
</body>
</html></content>
